<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrillMaster POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- ================= HEADER ================= -->
    <div class="header">
      <h1>🍔 <span id="headerShopName">GrillMaster POS</span></h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="showOrders()">📊 Orders</button>
        <button class="btn btn-secondary" onclick="showCustomers()">👥 Customers</button>
        <button class="btn btn-secondary" onclick="showProducts()">📦 Products</button>
        <button class="btn btn-warning" onclick="showSettings()">⚙️ Settings</button>
        <button class="btn btn-danger" onclick="clearCart()">🗑️ Clear Cart</button>
      </div>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="main-content">

    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
