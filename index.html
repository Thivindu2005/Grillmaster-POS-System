<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrillMaster POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- ================= HEADER ================= -->
    <div class="header">
      <h1>🍔 <span id="headerShopName">GrillMaster POS</span></h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="showOrders()">📊 Orders</button>
        <button class="btn btn-secondary" onclick="showCustomers()">👥 Customers</button>
        <button class="btn btn-secondary" onclick="showProducts()">📦 Products</button>
        <button class="btn btn-warning" onclick="showSettings()">⚙️ Settings</button>
        <button class="btn btn-danger" onclick="clearCart()">🗑️ Clear Cart</button>
      </div>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="main-content">

      <!-- Left side: products -->
      <div class="products-section">
        <input
          type="text"
          id="searchInput"
          class="search-bar"
          placeholder="🔍 Search burgers, fries, drinks..."
          oninput="renderProducts()"
        />

        <div class="categories" id="categories">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="burgers">Burgers</button>
          <button class="category-btn" data-category="fries">Fries</button>
          <button class="category-btn" data-category="drinks">Drinks</button>
          <button class="category-btn" data-category="desserts">Desserts</button>
        </div>

        <div class="products-grid" id="productGrid"></div>
      </div>

      <!-- Right side: current order -->
      <div class="cart-section">
        <h2>🛒 Current Order</h2>

        <select id="customerSelect" class="form-control"></select>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">Rs. 0.00</span>
          </div>
          <div class="summary-row">
            <span id="taxLabel">Tax (10%):</span>
            <span id="tax">Rs. 0.00</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">Rs. 0.00</span>
          </div>
        </div>

        <button class="btn btn-success checkout-btn" id="checkoutBtn" onclick="openPayment()" disabled>
          💳 Checkout
        </button>
      </div>

    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
