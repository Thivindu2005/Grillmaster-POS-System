<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrillMaster POS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- ================= HEADER ================= -->
    <div class="header">
      <h1>🍔 <span id="headerShopName">GrillMaster POS</span></h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="showOrders()">📊 Orders</button>
        <button class="btn btn-secondary" onclick="showCustomers()">👥 Customers</button>
        <button class="btn btn-secondary" onclick="showProducts()">📦 Products</button>
        <button class="btn btn-warning" onclick="showSettings()">⚙️ Settings</button>
        <button class="btn btn-danger" onclick="clearCart()">🗑️ Clear Cart</button>
      </div>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="main-content">

      <!-- Left side: products -->
      <div class="products-section">
        <input
          type="text"
          id="searchInput"
          class="search-bar"
          placeholder="🔍 Search burgers, fries, drinks..."
          oninput="renderProducts()"
        />

        <div class="categories" id="categories">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="burgers">Burgers</button>
          <button class="category-btn" data-category="fries">Fries</button>
          <button class="category-btn" data-category="drinks">Drinks</button>
          <button class="category-btn" data-category="desserts">Desserts</button>
        </div>

        <div class="products-grid" id="productGrid"></div>
      </div>

      <!-- Right side: current order -->
      <div class="cart-section">
        <h2>🛒 Current Order</h2>

        <select id="customerSelect" class="form-control"></select>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">Rs. 0.00</span>
          </div>
          <div class="summary-row">
            <span id="taxLabel">Tax (10%):</span>
            <span id="tax">Rs. 0.00</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">Rs. 0.00</span>
          </div>
        </div>

        <button class="btn btn-success checkout-btn" id="checkoutBtn" onclick="openPayment()" disabled>
          💳 Checkout
        </button>
      </div>

    </div>
  </div>


  <!-- ================= MODAL: PRODUCTS LIST ================= -->
  <div class="modal" id="productsModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h2>Product Management</h2>
        <button class="close-btn" onclick="closeModal('productsModal')">&times;</button>
      </div>
      <button class="btn btn-success" onclick="openProductForm()">➕ Add New Product</button>
      <div class="list" id="productsList"></div>
    </div>
  </div>

  <!-- ================= MODAL: PRODUCT FORM (add / edit) ================= -->
  <div class="modal modal-top" id="productFormModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="productFormTitle">Add New Product</h2>
        <button class="close-btn" onclick="closeModal('productFormModal')">&times;</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="productId" />

        <div class="form-group">
          <label for="productName">Product Name *</label>
          <input type="text" id="productName" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="productPrice">Price (LKR) *</label>
          <input type="number" id="productPrice" class="form-control" step="0.01" min="0" required />
        </div>

        <div class="form-group">
          <label for="productCategory">Category *</label>
          <select id="productCategory" class="form-control" required>
            <option value="burgers">Burgers</option>
            <option value="fries">Fries</option>
            <option value="drinks">Drinks</option>
            <option value="desserts">Desserts</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productIcon">Icon (Emoji) *</label>
          <input type="text" id="productIcon" class="form-control" maxlength="4" required />
        </div>

        <div class="form-group">
          <label for="productStock">Stock *</label>
          <input type="number" id="productStock" class="form-control" min="0" required />
        </div>

        <button type="submit" class="btn btn-success full">💾 Save Product</button>
      </form>
    </div>
  </div>

  <!-- ================= MODAL: PAYMENT ================= -->
  <div class="modal" id="paymentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Payment</h2>
        <button class="close-btn" onclick="closeModal('paymentModal')">&times;</button>
      </div>

      <div class="payment-total">
        Amount Due: <strong id="paymentDue">Rs. 0.00</strong>
      </div>

      <div class="form-group">
        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod" class="form-control">
          <option value="Cash">Cash</option>
          <option value="Card">Credit/Debit Card</option>
          <option value="Digital Wallet">Digital Wallet</option>
        </select>
      </div>

      <div id="cashFields">
        <div class="form-group">
          <label for="amountReceived">Amount Received</label>
          <input type="number" id="amountReceived" class="form-control" step="0.01" min="0" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label for="changeAmount">Change</label>
          <input type="text" id="changeAmount" class="form-control" value="Rs. 0.00" readonly />
        </div>
      </div>

      <button class="btn btn-success full" onclick="completePayment()">✓ Complete Payment</button>
    </div>
  </div>

  <!-- ================= MODAL: RECEIPT ================= -->
  <div class="modal" id="receiptModal">
    <div class="modal-content">
      <div id="receiptContent" class="receipt"></div>
      <button class="btn btn-outline full" onclick="window.print()">🖨️ Print Receipt</button>
      <button class="btn btn-dark full" onclick="closeModal('receiptModal')">New Transaction</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
